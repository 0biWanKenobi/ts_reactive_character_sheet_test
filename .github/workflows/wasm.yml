name: Rust WASM engine
on:
  push:
    branches: [rust-wasm-engine]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Test Rust expression engine
        working-directory: wasm
        run: cargo test
      - name: Build browser WASM package
        working-directory: wasm
        run: wasm-pack build --release --target bundler --out-dir pkg --out-name chumsky_dice
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
